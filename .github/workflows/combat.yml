name: Build Combat jar

permissions:
  contents: write

on:
  push:
    branches: [ combat ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: combat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Download Epic Fight jar (compile only, not stored in repo)
        run: |
          set -euo pipefail
          mkdir -p libs
          url="https://api.modrinth.com/v2/project/epic-fight/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D"
          file_url=$(curl -fsSL "$url" | jq -r '[.[] | select(.version_number | contains("20.14.17"))][0].files | (map(select(.primary)) + .)[0].url')
          if [ -z "$file_url" ] || [ "$file_url" = "null" ]; then echo "Epic Fight 20.14.17 not found" >&2; exit 1; fi
          curl -fsSL -o libs/epicfight-20.14.17.jar "$file_url"
          ls -l libs

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      - name: Publish compile errors on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          grep -E "error:|symbol:|location:|What went wrong" -A2 combat/build.log | head -150 > /tmp/errors.txt || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan combat-errors
          git rm -rf . -q || true
          cp /tmp/errors.txt errors.txt
          git add errors.txt
          git commit -q -m "combat build errors"
          git push -f origin combat-errors

      - uses: actions/upload-artifact@v4
        with:
          name: combat-1.0.0
          path: combat/build/libs/combat-1.0.0.jar
          if-no-files-found: error

      - name: Publish jar to Releases
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete combat-latest --yes --cleanup-tag || true
          gh release create combat-latest combat/build/libs/combat-1.0.0.jar --title "Combat 1.0.0" --notes "Combat mod jar built automatically."
