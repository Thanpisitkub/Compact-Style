name: Build jar

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: compact_style-jar
          path: build/libs/*.jar
      - name: Publish jar to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-jar --yes --cleanup-tag || true
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release create latest-jar "$JAR" --title "Compact Style jar" --notes "Built automatically from main."
