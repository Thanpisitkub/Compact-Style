name: Inspect Epic Fight API

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dump API
        run: |
          set -euo pipefail
          mkdir -p libs
          url="https://api.modrinth.com/v2/project/epic-fight/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D"
          file_url=$(curl -fsSL "$url" | jq -r --arg v "20.14.17" '[.[] | select(.version_number | contains($v))][0].files | (map(select(.primary)) + .)[0].url')
          curl -fsSL -o libs/ef.jar "$file_url"
          : > dump_out.txt
          for c in yesman.epicfight.api.animation.types.EntityState 'yesman.epicfight.world.entity.eventlistener.PlayerEventListener$EventType' yesman.epicfight.world.entity.eventlistener.SkillExecuteEvent 'yesman.epicfight.world.entity.eventlistener.ComboCounterHandleEvent$Causal' yesman.epicfight.world.entity.eventlistener.ComboCounterHandleEvent yesman.epicfight.skill.SkillContainer yesman.epicfight.skill.SkillDataManager yesman.epicfight.skill.Skill yesman.epicfight.skill.passive.PassiveSkill yesman.epicfight.skill.BasicAttack yesman.epicfight.skill.SkillCategories yesman.epicfight.skill.SkillSlots; do
            echo "=================== $c" >> dump_out.txt
            javap -p -cp libs/ef.jar "$c" 2>&1 | cut -c1-330 >> dump_out.txt || true
          done
          echo "=================== BasicAttack executeOnServer" >> dump_out.txt
          javap -p -c -constants -cp libs/ef.jar yesman.epicfight.skill.BasicAttack 2>&1 | sed -E 's/^ +[0-9]+: //; s/ +#[0-9]+//' | awk '/executeOnServer/{p=1} p' | cut -c1-260 | head -260 >> dump_out.txt || true
      - name: Publish dump to a temporary branch
        run: |
          mkdir -p /tmp/out && cp dump_out.txt /tmp/out/ef_dump.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan inspect-output
          git rm -rf . -q || true
          cp /tmp/out/ef_dump.txt ef_dump.txt
          git add ef_dump.txt
          git commit -q -m "EF dump"
          git push -f origin inspect-output
