name: Inspect Epic Fight API

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Epic Fight and dump combo logic
        run: |
          set -euo pipefail
          mkdir -p libs
          url="https://api.modrinth.com/v2/project/epic-fight/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D"
          file_url=$(curl -fsSL "$url" | jq -r --arg v "20.14.17" '[.[] | select(.version_number | contains($v))][0].files | (map(select(.primary)) + .)[0].url')
          curl -fsSL -o libs/ef.jar "$file_url"
          : > dump_out.txt
          fmt() { sed -E 's/ +#[0-9]+//; s/^ +[0-9]+: //; s#yesman/epicfight/##g; s#net/minecraft/##g' | cut -c1-200; }
          echo "=== AttackAnimation.getState / phase" >> dump_out.txt
          javap -p -c -constants -cp libs/ef.jar yesman.epicfight.api.animation.types.AttackAnimation | awk '/getState\(|getPhaseByTime\(|isBasicAttackAnimation|getPlaySpeed/{p=1} p{print} /^$/{p=0}' | fmt | head -150 >> dump_out.txt
          echo "=== BasicAttack skill" >> dump_out.txt
          javap -p -cp libs/ef.jar yesman.epicfight.skill.BasicAttack | cut -c1-220 >> dump_out.txt
          javap -p -c -constants -cp libs/ef.jar yesman.epicfight.skill.BasicAttack | awk '/executeOnServer|resetCombo|COMBO_COUNTER|getComboCounter|canExecute|updateContainer/{p=1} p{print} /^$/{p=0}' | fmt | head -220 >> dump_out.txt
          echo "=== BasicAttackAnimation" >> dump_out.txt
          javap -p -cp libs/ef.jar yesman.epicfight.api.animation.types.BasicAttackAnimation | cut -c1-220 >> dump_out.txt
          echo "=== EntityState canBasicAttack" >> dump_out.txt
          javap -p -cp libs/ef.jar yesman.epicfight.api.animation.types.EntityState | grep -iE "canBasic|attacking|inaction|setState|PHASE" | cut -c1-200 >> dump_out.txt
      - name: Publish dump
        run: |
          mkdir -p /tmp/out && cp dump_out.txt /tmp/out/ef_dump.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan inspect-output3
          git rm -rf . -q || true
          cp /tmp/out/ef_dump.txt ef_dump.txt
          git add ef_dump.txt
          git commit -q -m "EF dump 3"
          git push -f origin inspect-output3
